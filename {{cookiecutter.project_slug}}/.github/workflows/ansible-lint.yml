---
name: Ansible Lint

'on':
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip3 install -r requirements.txt

      - name: Run Ansible Lint
        run: ansible-lint . || true
